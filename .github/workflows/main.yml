name: Build Venera Android APK (Debug)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml   # 直接从 pubspec.yaml 读取要求的 Flutter 版本
          architecture: x64

      - name: Check Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: flutter pub get

      # 如果遇到许可证问题可保留，原版没加也能跑，加上更稳妥
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Venera-Debug-APK
          path: build/app/outputs/flutter-apk/*.apk
