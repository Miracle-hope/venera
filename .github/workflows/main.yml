name: Build Venera Android APK (Debug)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64

      - name: Check Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: flutter pub get

      # 生成项目所需的 key.properties 和 debug keystore
      - name: Generate debug keystore and key.properties
        run: |
          # 生成 debug keystore 到 android/app/debug.keystore
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias android \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"
          # 创建 android/key.properties，storeFile 路径相对于 android/app 目录
          echo "storeFile=debug.keystore" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=android" >> android/key.properties

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Venera-Debug-APK
          path: build/app/outputs/flutter-apk/*.apk
