name: Prepare Project for Local Build (with pub cache)

on:
  workflow_dispatch:   # 手动触发

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml

      - name: Download all dependencies (including git deps)
        run: flutter pub get

      # 打包项目源码，排除 .git、build、.dart_tool 等可能变化的目录
      - name: Pack project
        run: |
          tar --warning=no-file-changed \
              -czf venera-project.tar.gz \
              --exclude='.git' \
              --exclude='build' \
              --exclude='.dart_tool' \
              .

      # 打包 pub 缓存（通常不会变化，但保险加上 --warning）
      - name: Pack pub cache
        run: tar --warning=no-file-changed -czf pub-cache.tar.gz -C ~/.pub-cache .

      # 上传
      - uses: actions/upload-artifact@v4
        with:
          name: venera-full
          path: |
            venera-project.tar.gz
            pub-cache.tar.gz
