name: Prepare Project for Local Build

on:
  workflow_dispatch:   # 手动触发

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml

      # 下载所有依赖（包括 Git 依赖）
      - run: flutter pub get

      # 把整个项目打包（忽略 .git 目录）
      - name: Pack project
        run: tar -czf venera-project.tar.gz --exclude='.git' .

      # 上传给你
      - uses: actions/upload-artifact@v4
        with:
          name: venera-project
          path: venera-project.tar.gz