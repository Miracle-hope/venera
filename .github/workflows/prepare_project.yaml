name: Prepare Project for Local Build (with pub cache)

on:
  workflow_dispatch:   # 手动触发

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml

      - name: Download all dependencies (including git deps)
        run: flutter pub get

      - name: Pack project (without .git)
        run: tar -czf venera-project.tar.gz --exclude='.git' .

      - name: Pack pub cache
        run: tar -czf pub-cache.tar.gz -C ~/.pub-cache .

      - name: Upload both archives
        uses: actions/upload-artifact@v4
        with:
          name: venera-full
          path: |
            venera-project.tar.gz
            pub-cache.tar.gz
